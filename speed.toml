# speed ci live demo: every check runs a real tool.

[security]
sast_cmd = "semgrep scan --config p/python --json --quiet --metrics=off ."
sca_cmd = "python3 -m pip_audit -r requirements.txt -f json"
severity_threshold = "high"

[ci]
security_mode = "strict"
services = ["postgres"]
parallel = true
pull_request = true

[ci.tools.trivy]
format = "trivy"

[ci.tools.gitleaks]
format = "gitleaks"

[ci.tools.codeql]
format = "sarif"
cmd = "sh scripts/codeql.sh"

# SonarQube Community Build on the developer's machine. GitHub's runners cannot reach
# localhost, so in GitHub Actions speed ci shows this check as skipped.
[ci.sonarqube]
host_url = "http://localhost:9000"
project_key = "speed-ci-demo-live"
scanner_cmd = "$HOME/sonarqube-local/sonar-scanner-6.2.1.4610-macosx-aarch64/bin/sonar-scanner"
