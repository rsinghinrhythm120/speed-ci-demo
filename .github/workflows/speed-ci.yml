# Generated by `speed ci init`. Runs `speed ci` on every pull request and on
# every push to main. `speed ci` makes no model calls, so this workflow
# needs no model credentials and costs nothing beyond runner time.
# Rerun `speed ci init --force` after adding checks, tools or services to speed.toml.
name: SPEED CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: speed-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: ["eval", "lint", "typecheck", "secrets", "sast", "sca", "trivy", "gitleaks", "codeql"]
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          # Keep tokens out of .git/config, where the project's own scripts could read them.
          persist-credentials: false

      - name: Check out SPEED
        uses: actions/checkout@v4
        with:
          repository: "ArulaAI/workbench"
          ref: "feat/speed-ci"
          path: .speed-tool
          persist-credentials: false
          # A private SPEED repository needs a token that can read it.
          token: ${{ secrets.SPEED_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SPEED
        run: |
          # Move SPEED out of the project so the project's own tools never see it.
          mv .speed-tool "$RUNNER_TEMP/speed"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          python -m venv "$RUNNER_TEMP/speed/.venv"
          "$RUNNER_TEMP/speed/.venv/bin/pip" install -q -r "$RUNNER_TEMP/speed/requirements.txt"
          echo "SPEED_PYTHON=$RUNNER_TEMP/speed/.venv/bin/python3" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/speed" >> "$GITHUB_PATH"

      - name: Install trivy
        if: matrix.check == 'trivy'
        run: |
          cd "$RUNNER_TEMP"
          curl -sfLO https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_checksums.txt | grep ' trivy_0.76.1_Linux-64bit.tar.gz$' | sha256sum -c -
          sudo tar -xzf trivy_0.76.1_Linux-64bit.tar.gz -C /usr/local/bin trivy

      - name: Install gitleaks
        if: matrix.check == 'gitleaks'
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      # Project setup: these steps were detected from the repository.
      # Review them and add anything else the project needs to build and test.
      - run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt
      - name: Install Semgrep and pip-audit
        if: matrix.check == 'sast' || matrix.check == 'sca'
        run: pip install -q semgrep==1.182.0 pip-audit==2.10.1
      - name: Put the runner's CodeQL on PATH
        if: matrix.check == 'codeql'
        run: |
          codeql_dir=$(ls -d /opt/hostedtoolcache/CodeQL/*/x64/codeql 2>/dev/null | sort -V | tail -1)
          if [ -z "$codeql_dir" ]; then
            curl -sfL https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-linux64.tar.gz \
              | tar -xz -C "$RUNNER_TEMP"
            codeql_dir="$RUNNER_TEMP/codeql"
          fi
          echo "$codeql_dir" >> "$GITHUB_PATH"


      - name: Run ${{ matrix.check }}
        env:
          # Forks and Dependabot get no secrets; checks that need one are skipped there.
          SPEED_CI_SECRETS_UNAVAILABLE: "${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}"
        run: speed --json ci --only "${{ matrix.check }}" > "$RUNNER_TEMP/speed-ci-report.json"

      - name: Upload this check's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-ci-check-${{ matrix.check }}
          path: .speed/ci/
          include-hidden-files: true
          if-no-files-found: warn

  check-db:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: ["test", "e2e", "api", "integration"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "postgres"  # speed-ci: test service credential
          POSTGRES_PASSWORD: "postgres"  # speed-ci: test service credential
          POSTGRES_DB: "test"  # speed-ci: test service credential
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"  # speed-ci: test service credential, not a secret
      PGHOST: "localhost"  # speed-ci: test service credential, not a secret
      PGPORT: "5432"  # speed-ci: test service credential, not a secret
      PGUSER: "postgres"  # speed-ci: test service credential, not a secret
      PGPASSWORD: "postgres"  # speed-ci: test service credential, not a secret
      PGDATABASE: "test"  # speed-ci: test service credential, not a secret
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          # Keep tokens out of .git/config, where the project's own scripts could read them.
          persist-credentials: false

      - name: Check out SPEED
        uses: actions/checkout@v4
        with:
          repository: "ArulaAI/workbench"
          ref: "feat/speed-ci"
          path: .speed-tool
          persist-credentials: false
          # A private SPEED repository needs a token that can read it.
          token: ${{ secrets.SPEED_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SPEED
        run: |
          # Move SPEED out of the project so the project's own tools never see it.
          mv .speed-tool "$RUNNER_TEMP/speed"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          python -m venv "$RUNNER_TEMP/speed/.venv"
          "$RUNNER_TEMP/speed/.venv/bin/pip" install -q -r "$RUNNER_TEMP/speed/requirements.txt"
          echo "SPEED_PYTHON=$RUNNER_TEMP/speed/.venv/bin/python3" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/speed" >> "$GITHUB_PATH"

      - name: Install trivy
        if: matrix.check == 'trivy'
        run: |
          cd "$RUNNER_TEMP"
          curl -sfLO https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_checksums.txt | grep ' trivy_0.76.1_Linux-64bit.tar.gz$' | sha256sum -c -
          sudo tar -xzf trivy_0.76.1_Linux-64bit.tar.gz -C /usr/local/bin trivy

      - name: Install gitleaks
        if: matrix.check == 'gitleaks'
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      # Project setup: these steps were detected from the repository.
      # Review them and add anything else the project needs to build and test.
      - run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt

      - name: Run ${{ matrix.check }}
        env:
          # Forks and Dependabot get no secrets; checks that need one are skipped there.
          SPEED_CI_SECRETS_UNAVAILABLE: "${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}"
        run: speed --json ci --only "${{ matrix.check }}" > "$RUNNER_TEMP/speed-ci-report.json"

      - name: Upload this check's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-ci-check-${{ matrix.check }}
          path: .speed/ci/
          include-hidden-files: true
          if-no-files-found: warn

  speed-ci:
    # The one status check to require: it passes only when every check passed.
    name: speed-ci
    needs: [check, check-db]
    # Runs when checks failed, but not when a newer push cancelled this run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out SPEED
        uses: actions/checkout@v4
        with:
          repository: "ArulaAI/workbench"
          ref: "feat/speed-ci"
          path: .speed-tool
          persist-credentials: false
          token: ${{ secrets.SPEED_REPO_TOKEN || github.token }}

      - name: Download the check reports
        uses: actions/download-artifact@v4
        with:
          pattern: speed-ci-check-*
          path: reports

      - name: Combine the results
        run: |
          status=0
          python3 .speed-tool/lib/ci_tools.py merge merged reports/speed-ci-check-eval reports/speed-ci-check-lint reports/speed-ci-check-typecheck reports/speed-ci-check-test reports/speed-ci-check-e2e reports/speed-ci-check-api reports/speed-ci-check-integration reports/speed-ci-check-secrets reports/speed-ci-check-sast reports/speed-ci-check-sca reports/speed-ci-check-trivy reports/speed-ci-check-gitleaks reports/speed-ci-check-codeql || status=$?
          if [ -f merged/summary.md ]; then cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Upload findings to the Security tab
        if: always() && hashFiles('merged/speed-ci.sarif') != ''
        # Needs GitHub code scanning (public repositories, or Advanced Security on private ones).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: merged/speed-ci.sarif
          category: speed-ci

      - name: Upload the combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-ci-report
          path: merged/
          if-no-files-found: warn
